; PHP settings for Moodle. Its environment check (Site administration → Server → Environment) lists what it needs.

; Moodle refuses to install below 5000.
max_input_vars = 5000
memory_limit = 256M
max_execution_time = 300

; The largest upload, such as a course backup to restore. moodle.flyindycenter.com isn't behind Cloudflare's proxy
; (which caps a request at 100 MB), so this is the only limit; Apache's own is 1 GB. Each upload sits in the
; container's /tmp and then in moodledata, so this also bounds how much one request can add to the server's disk.
upload_max_filesize = 512M
post_max_size = 512M

; Moodle's code only changes with a new image, so OPcache can hold onto it.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.use_cwd = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1

; The server's clock. Each person's displayed timezone is a Moodle setting, not this.
date.timezone = UTC

expose_php = Off
